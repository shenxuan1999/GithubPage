<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON 解析器</title>
  <link rel="stylesheet" href="../tool-base.css">
  <style>
    button,
    textarea {
      font: inherit;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      min-height: auto;
    }

    .status-strip {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) repeat(3, auto);
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.035)),
        rgba(17, 19, 23, 0.86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .workspace {
      flex: 1;
      min-height: 540px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 18px;
    }

    .tool-toggle {
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      font-size: 13px;
      white-space: nowrap;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .tool-toggle:hover,
    .tool-toggle:focus-visible {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-strong);
      color: var(--text);
      outline: none;
    }

    .tool-toggle.active {
      color: #050505;
      background: var(--success);
      border-color: var(--success);
    }

    .tool-toggle svg {
      width: 16px;
      height: 16px;
    }

    .editor-shell {
      height: 100%;
      min-height: 480px;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      background: #080b10;
    }

    textarea {
      width: 100%;
      height: 100%;
      min-height: 480px;
      padding: 18px;
      resize: none;
      outline: none;
      border: 0;
      display: block;
      color: #e9eef8;
      background: #080b10;
      caret-color: var(--success);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.68;
      tab-size: 2;
      letter-spacing: 0;
      overflow: auto;
      white-space: pre;
    }

    .output {
      position: relative;
      height: 100%;
      min-height: 480px;
      margin: 0;
      padding: 18px 0;
      overflow: auto;
      color: #dbe7f7;
      background: #080b10;
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.68;
      white-space: pre;
      tab-size: 2;
    }

    .placeholder {
      padding-left: 18px;
      color: rgba(154, 164, 178, 0.72);
    }

    /* Only the rows in view are rendered; the spacer keeps the full scroll size. */
    .json-spacer {
      position: relative;
      min-width: 100%;
    }

    .json-rows {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    .json-line {
      min-width: max-content;
      display: flex;
      align-items: baseline;
      height: 23.52px;
    }

    .output-line-no {
      width: 56px;
      padding-right: 10px;
      flex: 0 0 56px;
      color: rgba(154, 164, 178, 0.62);
      background: #07090d;
      border-right: 1px solid var(--border);
      text-align: right;
      user-select: none;
      align-self: stretch;
    }

    .json-content {
      min-width: 0;
      padding-right: 24px;
    }

    .json-indent {
      display: inline-block;
      width: calc(var(--depth) * 22px);
    }

    .fold-toggle {
      width: 18px;
      height: 18px;
      margin: 0 4px 0 0;
      padding: 0;
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      color: var(--muted-strong);
      background: rgba(255, 255, 255, 0.08);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1;
      vertical-align: 1px;
    }

    .fold-toggle:hover {
      color: #050505;
      background: var(--success);
    }

    .json-key {
      color: #93c5fd;
    }

    .json-string {
      color: #86efac;
    }

    .json-number {
      color: #fbbf24;
    }

    .json-boolean {
      color: #f0abfc;
    }

    .json-null {
      color: #c4b5fd;
    }

    .json-bracket,
    .json-punctuation,
    .json-count {
      color: #dbe7f7;
    }

    .json-count {
      opacity: 0.62;
    }

    .error-box {
      margin: 14px;
      padding: 14px 15px;
      border-radius: 8px;
      border: 1px solid rgba(251, 113, 133, 0.32);
      background: rgba(251, 113, 133, 0.1);
      color: #fecdd3;
      font-size: 14px;
      line-height: 1.55;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 980px) {
      .app {
        width: min(100vw - 24px, 760px);
        height: auto;
        min-height: 100vh;
        padding: 14px 0;
      }

      .topbar,
      .status-strip,
      .workspace {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }

      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 13px;
        line-height: 1.55;
      }

      .status-strip {
        display: flex;
        align-items: stretch;
        flex-direction: column;
      }

      .status-text {
        white-space: normal;
      }

      .metric {
        width: 100%;
      }

      .workspace {
        min-height: 0;
        grid-template-rows: none;
      }

      .pane {
        height: 75vh;
        min-height: 420px;
      }

      .editor-shell,
      textarea,
      .output {
        min-height: 360px;
        font-size: 13px;
      }

      .line-gutter,
      .output-line-no {
        width: 48px;
        flex-basis: 48px;
        font-size: 13px;
      }

      .editor-shell {
        grid-template-columns: 48px minmax(0, 1fr);
      }
    }
  </style>
  <link rel="stylesheet" href="../tool-light.css" data-light-theme>
  <style id="lightThemeStyles">
    /* Light theme inversion */
    .tool-toggle {
      color: #475569;
      background: rgba(255, 255, 255, 0.84);
      border-color: rgba(15, 23, 42, 0.18);
    }

    .tool-toggle:hover,
    .tool-toggle:focus-visible {
      color: #0f172a;
      background: #e2e8f0;
      border-color: rgba(15, 23, 42, 0.3);
    }

    .tool-toggle.active {
      color: #ffffff;
      background: #0f766e;
      border-color: #0f766e;
    }

  </style>
  <script src="../theme.js"></script>
  <script src="../tool-common.js"></script>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M8 4H6a2 2 0 0 0-2 2v3a3 3 0 0 1-2 3 3 3 0 0 1 2 3v3a2 2 0 0 0 2 2h2"></path>
            <path d="M16 4h2a2 2 0 0 1 2 2v3a3 3 0 0 0 2 3 3 3 0 0 0-2 3v3a2 2 0 0 1-2 2h-2"></path>
          </svg>
        </div>
        <div>
          <h1>JSON 解析器</h1>
          <p class="subtitle">自动校验、格式化、去转义，并将 Unicode 中文直接显示。</p>
        </div>
      </div>
      <div class="actions">
        <button class="button theme-toggle" id="themeToggle" type="button">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.42 1.42"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.42"></path>
          </svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
          <span id="themeToggleText">主题</span>
        </button>

        <button class="button" id="sampleBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path>
            <path d="M14 2v4a2 2 0 0 0 2 2h4"></path>
            <path d="M10 9H8"></path>
            <path d="M16 13H8"></path>
            <path d="M16 17H8"></path>
          </svg>
          示例
        </button>
        <button class="button primary" id="copyBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect width="14" height="14" x="8" y="8" rx="2"></rect>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
          </svg>
          复制结果
        </button>
      </div>
    </header>

    <section class="status-strip" id="statusStrip" aria-live="polite">
      <div class="status-main">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text" id="statusText">等待输入 JSON</span>
      </div>
      <div class="metric" id="typeMetric">类型：-</div>
      <div class="metric" id="sizeMetric">大小：0 B</div>
      <div class="metric" id="lineMetric">行数：0</div>
    </section>

    <section class="workspace">
      <article class="pane">
        <div class="pane-head">
          <div class="pane-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
            </svg>
            输入
          </div>
          <div class="pane-tools">
            <button class="icon-button" id="pasteBtn" type="button" title="粘贴">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M8 4v3a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V4"></path>
                <rect width="8" height="4" x="8" y="2" rx="1"></rect>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              </svg>
            </button>
            <button class="icon-button" id="clearBtn" type="button" title="清空">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M3 6h18"></path>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="editor-wrap">
          <div class="editor-shell">
            <pre class="line-gutter" id="inputLines" aria-hidden="true">1</pre>
            <textarea id="input" spellcheck="false" wrap="off"
              placeholder='粘贴 JSON，例如：{"name":"\u5f20\u4e09","items":[1,2,3]}'></textarea>
          </div>
        </div>
      </article>

      <article class="pane">
        <div class="pane-head">
          <div class="pane-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="m18 16 4-4-4-4"></path>
              <path d="m6 8-4 4 4 4"></path>
              <path d="m14.5 4-5 16"></path>
            </svg>
            解析结果
          </div>
          <div class="pane-tools">
            <button class="tool-toggle" id="sourceBtn" type="button" aria-pressed="false"
              title="切换为可编辑、可直接选中复制的源码视图">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
                <path d="M14 2v6h6"></path>
                <path d="m10 13-2 2 2 2"></path>
                <path d="m14 17 2-2-2-2"></path>
              </svg>
              源码
            </button>
            <button class="icon-button" id="downloadBtn" type="button" title="下载 JSON">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M12 15V3"></path>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <path d="m7 10 5 5 5-5"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="editor-wrap" id="resultWrap">
          <div class="output placeholder" id="output">解析后的 JSON 会显示在这里。</div>
          <div class="editor-shell hidden" id="sourceView">
            <pre class="line-gutter" id="sourceLines" aria-hidden="true">1</pre>
            <textarea id="source" spellcheck="false" wrap="off" aria-label="格式化后的 JSON 源码，可编辑"></textarea>
          </div>
          <div class="error-box hidden" id="errorBox"></div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const input = document.querySelector("#input");
    const inputLines = document.querySelector("#inputLines");
    const output = document.querySelector("#output");
    const errorBox = document.querySelector("#errorBox");
    const typeMetric = document.querySelector("#typeMetric");
    const sizeMetric = document.querySelector("#sizeMetric");
    const lineMetric = document.querySelector("#lineMetric");
    const sampleBtn = document.querySelector("#sampleBtn");
    const clearBtn = document.querySelector("#clearBtn");
    const pasteBtn = document.querySelector("#pasteBtn");
    const copyBtn = document.querySelector("#copyBtn");
    const downloadBtn = document.querySelector("#downloadBtn");
    const sourceBtn = document.querySelector("#sourceBtn");
    const sourceView = document.querySelector("#sourceView");
    const sourceLines = document.querySelector("#sourceLines");
    const source = document.querySelector("#source");

    const sample = String.raw`{
  "catalog": [
    {
      "key": "AlarmLine",
      "label": "\u62A5\u8B66\u7EBF",
      "description": null,
      "tags": ["line", "threshold", "\u544A\u8B66"]
    },
    {
      "key": "AlarmLevel",
      "label": "\u62A5\u8B66\u63A8\u9001\u7EA7\u522B",
      "description": null,
      "levels": [
        { "code": 1, "name": "\u4F4E", "channels": ["web"] },
        { "code": 2, "name": "\u4E2D", "channels": ["web", "sms"] },
        { "code": 3, "name": "\u9AD8", "channels": ["web", "sms", "phone"] }
      ]
    }
  ],
  "dimensionValues": {
    "kind": 6,
    "flag": true,
    "module": "AdvancedAlarmSystem",
    "group": "AlarmMessage",
    "method": "QueryMessageIdentityAsync",
    "identityTypes": ["device", "region", "user"],
    "retryIntervals": [5, 15, 30, 60],
    "enabledWeekdays": [1, 2, 3, 4, 5],
    "matrix": [
      [1, 0, 0],
      [0, 1, 0],
      [0, 0, 1]
    ]
  },
  "receivers": [
    {
      "id": 1001,
      "name": "\u8FD0\u7EF4\u4E00\u7EC4",
      "users": [
        { "id": "u001", "name": "\u5F20\u4E09", "roles": ["owner", "reviewer"] },
        { "id": "u002", "name": "\u674E\u56DB", "roles": ["viewer"] }
      ]
    },
    {
      "id": 1002,
      "name": "\u503C\u73ED\u4E2D\u5FC3",
      "users": []
    }
  ],
  "history": [
    { "time": "2026-07-06 09:00:00", "status": "created" },
    { "time": "2026-07-06 09:15:00", "status": "pushed" },
    { "time": "2026-07-06 09:20:00", "status": "confirmed" }
  ]
}`;
    let formattedResult = "";
    let currentJsonValue = null;
    let collapsedPaths = new Set();
    let sourceMode = false;
    let sourceBase = "";
    let parseTimer = 0;
    let sourceTimer = 0;

    const ROW_OVERSCAN = 30;
    const treeSpacer = document.createElement("div");
    const rowsLayer = document.createElement("div");
    treeSpacer.className = "json-spacer";
    rowsLayer.className = "json-rows";
    treeSpacer.append(rowsLayer);
    let jsonRows = [];
    let widestRowIndex = -1;
    let widestRowUnits = -1;
    let rowHeight = 0;
    let treeLayoutDirty = false;
    let renderedStart = -1;
    let renderedEnd = -1;
    let renderFrame = 0;

    input.addEventListener("input", () => {
      renderLineNumbers(inputLines, input);
      window.clearTimeout(parseTimer);
      parseTimer = window.setTimeout(parseAndRender, 120);
    });

    syncGutterScroll(inputLines, input);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Tab") {
        event.preventDefault();
        const start = input.selectionStart;
        const end = input.selectionEnd;
        input.setRangeText("  ", start, end, "end");
        renderLineNumbers(inputLines, input);
        parseAndRender();
      }
    });

    sampleBtn.addEventListener("click", () => {
      input.value = sample;
      input.setSelectionRange(0, 0);
      input.focus();
      renderLineNumbers(inputLines, input);
      parseAndRender();
    });

    clearBtn.addEventListener("click", () => {
      input.value = "";
      input.focus();
      renderLineNumbers(inputLines, input);
      renderEmpty();
    });

    pasteBtn.addEventListener("click", async () => {
      const text = await readClipboardText();
      if (text === null) {
        return;
      }

      input.value = text;
      input.focus();
      renderLineNumbers(inputLines, input);
      parseAndRender();
    });

    copyBtn.addEventListener("click", () => {
      if (!formattedResult) {
        setStatus("invalid", "没有可复制的解析结果");
        return;
      }

      copyText(getResultText(), isSourceEdited() ? "已复制修改后的源码" : "已复制格式化后的 JSON");
    });

    downloadBtn.addEventListener("click", () => {
      if (!formattedResult) {
        setStatus("invalid", "没有可下载的解析结果");
        return;
      }

      downloadFile(getResultText(), "formatted.json", "application/json;charset=utf-8");
    });

    sourceBtn.addEventListener("click", () => {
      sourceMode = !sourceMode;
      updateResultView();
    });

    syncGutterScroll(sourceLines, source);

    source.addEventListener("input", () => {
      renderLineNumbers(sourceLines, source);
      window.clearTimeout(sourceTimer);
      sourceTimer = window.setTimeout(checkSource, 120);
    });

    source.addEventListener("keydown", (event) => {
      if (event.key === "Tab") {
        event.preventDefault();
        source.setRangeText("  ", source.selectionStart, source.selectionEnd, "end");
        renderLineNumbers(sourceLines, source);
        checkSource();
      }
    });

    output.addEventListener("click", (event) => {
      const button = event.target.closest(".fold-toggle");
      if (!button || !output.contains(button) || currentJsonValue === null) {
        return;
      }

      const path = button.dataset.path;
      if (collapsedPaths.has(path)) {
        collapsedPaths.delete(path);
      } else {
        collapsedPaths.add(path);
      }
      drawJsonTree(currentJsonValue);
    });

    output.addEventListener("scroll", () => {
      if (!renderFrame) {
        renderFrame = window.requestAnimationFrame(() => {
          renderFrame = 0;
          renderVisibleRows();
        });
      }
    }, { passive: true });

    new ResizeObserver(() => renderVisibleRows()).observe(output);

    function parseAndRender() {
      const raw = input.value.trim();

      if (!raw) {
        renderEmpty();
        return;
      }

      const result = parseJson(raw);

      if (!result.ok) {
        formattedResult = "";
        currentJsonValue = null;
        collapsedPaths.clear();
        jsonRows = [];
        output.classList.add("hidden");
        updateResultView();
        errorBox.classList.remove("hidden");
        errorBox.textContent = result.message;
        setStatus("invalid", "JSON 校验失败");
        typeMetric.textContent = "类型：-";
        sizeMetric.textContent = `大小：${formatBytes(new Blob([input.value]).size)}`;
        lineMetric.textContent = `行数：${countLines(input.value)}`;
        return;
      }

      formattedResult = JSON.stringify(result.value, null, 2);
      currentJsonValue = result.value;
      collapsedPaths.clear();
      drawJsonTree(result.value);
      updateResultView();
      errorBox.classList.add("hidden");
      setStatus("valid", result.unescaped ? "JSON 合法，已格式化并去除外层转义" : "JSON 合法，已格式化");
      typeMetric.textContent = `类型：${getJsonType(result.value)}`;
      sizeMetric.textContent = `大小：${formatBytes(new Blob([formattedResult]).size)}`;
      lineMetric.textContent = `行数：${countLines(formattedResult)}`;
    }

    // Flattens the tree into plain row objects; only the rows in view become DOM (see renderVisibleRows).
    function drawJsonTree(value) {
      jsonRows = [];
      widestRowIndex = -1;
      widestRowUnits = -1;
      flattenJsonNode(value, 0, null, "[]", false);
      output.classList.remove("placeholder", "hidden");
      if (!treeSpacer.isConnected) {
        output.replaceChildren(treeSpacer);
      }
      treeLayoutDirty = true;
      renderVisibleRows(true);
    }

    function flattenJsonNode(value, depth, key, pathId, trailingComma) {
      const keyUnits = key === null ? 0 : textUnits(key) + 4;

      if (value === null || typeof value !== "object") {
        const valueUnits = typeof value === "string" ? textUnits(value) + 2 : String(value).length;
        pushRow({ kind: "value", depth, key, value, comma: trailingComma }, depth * 3 + keyUnits + valueUnits);
        return;
      }

      const isArray = Array.isArray(value);
      const keys = isArray ? null : Object.keys(value);
      const length = isArray ? value.length : keys.length;
      const open = isArray ? "[" : "{";
      const close = isArray ? "]" : "}";

      if (length === 0) {
        pushRow({ kind: "bracket", depth, key, text: `${open}${close}`, comma: trailingComma }, depth * 3 + keyUnits + 3);
        return;
      }

      if (collapsedPaths.has(pathId)) {
        pushRow({ kind: "bracket", depth, key, pathId, text: `${open}...${close}`, count: length, comma: trailingComma },
          depth * 3 + keyUnits + 16);
        return;
      }

      pushRow({ kind: "bracket", depth, key, pathId, text: open }, depth * 3 + keyUnits + 4);

      for (let index = 0; index < length; index += 1) {
        const entryKey = isArray ? String(index) : keys[index];
        const child = isArray ? value[index] : value[entryKey];
        const childId = child !== null && typeof child === "object" ? childPathId(pathId, entryKey) : "";
        flattenJsonNode(child, depth + 1, isArray ? null : entryKey, childId, index < length - 1);
      }

      pushRow({ kind: "bracket", depth, key: null, text: close, comma: trailingComma }, 0);
    }

    function pushRow(row, units) {
      if (units > widestRowUnits) {
        widestRowUnits = units;
        widestRowIndex = jsonRows.length;
      }
      jsonRows.push(row);
    }

    // Same string as JSON.stringify(path.concat(key)), built without copying the path array.
    function childPathId(pathId, key) {
      const encodedKey = JSON.stringify(key);
      return pathId === "[]" ? `[${encodedKey}]` : `${pathId.slice(0, -1)},${encodedKey}]`;
    }

    // Rough monospace width: CJK and other wide characters take about two columns.
    function textUnits(text) {
      let units = text.length;
      for (let index = 0; index < text.length; index += 1) {
        if (text.charCodeAt(index) > 0x2e7f) {
          units += 1;
        }
      }
      return units;
    }

    function renderVisibleRows(force = false) {
      if (!treeSpacer.isConnected || output.classList.contains("hidden")) {
        return;
      }

      if (treeLayoutDirty) {
        rowHeight = rowHeight || measureRow(createJsonLine({ kind: "bracket", depth: 0, key: null, text: "{" }, 1)).height;
        if (!rowHeight) {
          return;
        }

        // The widest row is picked by estimate, then measured for real so the horizontal scroll size is stable.
        const widest = measureRow(createJsonLine(jsonRows[widestRowIndex], jsonRows.length)).width;
        treeSpacer.style.height = `${jsonRows.length * rowHeight}px`;
        treeSpacer.style.width = `${Math.ceil(widest)}px`;
        treeLayoutDirty = false;
        force = true;
      }

      // scrollTop can still be stale (larger than the new content) right after the rows change.
      const maxTop = Math.max(0, jsonRows.length * rowHeight - output.clientHeight);
      const top = Math.min(maxTop, Math.max(0, output.scrollTop - treeSpacer.offsetTop));
      const first = Math.floor(top / rowHeight);
      const start = Math.max(0, first - ROW_OVERSCAN);
      const end = Math.min(jsonRows.length, first + Math.ceil(output.clientHeight / rowHeight) + ROW_OVERSCAN);
      if (!force && start === renderedStart && end === renderedEnd) {
        return;
      }

      renderedStart = start;
      renderedEnd = end;
      const fragment = document.createDocumentFragment();
      for (let index = start; index < end; index += 1) {
        fragment.append(createJsonLine(jsonRows[index], index + 1));
      }
      rowsLayer.style.transform = `translateY(${start * rowHeight}px)`;
      rowsLayer.replaceChildren(fragment);
    }

    function measureRow(line) {
      line.style.position = "absolute";
      line.style.visibility = "hidden";
      treeSpacer.append(line);
      const rect = line.getBoundingClientRect();
      line.remove();
      return rect;
    }

    function createJsonLine(row, lineNumber) {
      const line = document.createElement("div");
      line.className = "json-line";

      const number = document.createElement("span");
      number.className = "output-line-no";
      number.textContent = lineNumber;

      const content = document.createElement("span");
      content.className = "json-content";
      content.style.setProperty("--depth", row.depth);

      const indent = document.createElement("span");
      indent.className = "json-indent";
      content.append(indent);

      if (row.pathId) {
        appendFoldButton(content, row.pathId, Boolean(row.count));
      }
      appendKey(content, row.key);
      if (row.kind === "value") {
        appendPrimitive(content, row.value);
      } else {
        appendToken(content, "json-bracket", row.text);
      }
      if (row.count) {
        appendToken(content, "json-count", ` ${row.count} 项`);
      }
      appendComma(content, row.comma);

      line.append(number, content);
      return line;
    }

    function appendFoldButton(parent, pathId, collapsed) {
      const button = document.createElement("button");
      button.className = "fold-toggle";
      button.type = "button";
      button.dataset.path = pathId;
      button.title = collapsed ? "展开" : "折叠";
      button.setAttribute("aria-label", collapsed ? "展开" : "折叠");
      button.textContent = collapsed ? "▶" : "▼";
      parent.append(button);
    }

    function appendKey(parent, key) {
      if (key === null) {
        return;
      }

      appendToken(parent, "json-key", `${JSON.stringify(key)}: `);
    }

    function appendPrimitive(parent, value) {
      if (typeof value === "string") {
        appendToken(parent, "json-string", JSON.stringify(value));
        return;
      }

      if (typeof value === "number") {
        appendToken(parent, "json-number", String(value));
        return;
      }

      if (typeof value === "boolean") {
        appendToken(parent, "json-boolean", String(value));
        return;
      }

      appendToken(parent, "json-null", "null");
    }

    function appendComma(parent, enabled) {
      if (enabled) {
        appendToken(parent, "json-punctuation", ",");
      }
    }

    function appendToken(parent, className, text) {
      const token = document.createElement("span");
      token.className = className;
      token.textContent = text;
      parent.append(token);
    }

    function renderEmpty() {
      formattedResult = "";
      currentJsonValue = null;
      collapsedPaths.clear();
      jsonRows = [];
      output.textContent = "解析后的 JSON 会显示在这里。";
      output.classList.add("placeholder");
      output.classList.remove("hidden");
      updateResultView();
      errorBox.classList.add("hidden");
      setStatus("", "等待输入 JSON");
      typeMetric.textContent = "类型：-";
      sizeMetric.textContent = "大小：0 B";
      lineMetric.textContent = "行数：0";
    }

    // Source view shows the formatted JSON as editable text so any part can be changed, selected and copied.
    function updateResultView() {
      const showSource = sourceMode && formattedResult !== "";
      sourceBtn.classList.toggle("active", sourceMode);
      sourceBtn.setAttribute("aria-pressed", String(sourceMode));
      sourceView.classList.toggle("hidden", !showSource);

      if (!formattedResult) {
        sourceBase = "";
        return;
      }

      output.classList.toggle("hidden", showSource);
      // Refill only when the parsed result changes, so edits survive switching views.
      if (showSource && sourceBase !== formattedResult) {
        sourceBase = formattedResult;
        source.value = formattedResult;
        source.scrollTop = 0;
        renderLineNumbers(sourceLines, source);
      }
    }

    function getResultText() {
      return sourceMode && formattedResult ? source.value : formattedResult;
    }

    function isSourceEdited() {
      return sourceMode && formattedResult !== "" && source.value !== formattedResult;
    }

    function checkSource() {
      if (!isSourceEdited()) {
        setStatus("valid", "JSON 合法，已格式化");
        return;
      }

      try {
        JSON.parse(source.value);
        setStatus("valid", "源码已修改，JSON 合法");
      } catch (error) {
        const position = extractErrorPosition(error.message);
        const location = position === null ? null : getLineColumn(source.value, position);
        setStatus("invalid", location
          ? `源码已修改，但 JSON 不合法：第 ${location.line} 行，第 ${location.column} 列`
          : "源码已修改，但 JSON 不合法");
      }
    }

    function getJsonType(value) {
      if (Array.isArray(value)) {
        return "数组";
      }
      if (value === null) {
        return "null";
      }

      const types = {
        object: "对象",
        string: "字符串",
        number: "数字",
        boolean: "布尔值"
      };
      return types[typeof value] || typeof value;
    }

    renderLineNumbers(inputLines, input);
    renderEmpty();
  </script>
</body>

</html>
